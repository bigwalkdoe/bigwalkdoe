<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#2563eb"/>
      <stop offset="1"   stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#60a5fa"/>
      <stop offset="1"   stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: url(#bgDark); }
        .ring { stroke: rgba(255,255,255,0.18); }
        .text { fill: #0b1220; }
      }
      .bg { fill: url(#bg); }
      .ring { stroke: rgba(15,23,42,0.12); }
      .text { fill: #ffffff; }
    </style>
  </defs>
  <rect width="400" height="400" rx="80" class="bg"/>
  <rect x="24" y="24" width="352" height="352" rx="64" fill="none" class="ring" stroke-width="2"/>
  <text x="200" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="-6" class="text">BWD</text>
</svg>